title: Sipgate
path: sipgate
icon: mdi:phone
type: custom:grid-layout

layout:
  grid-template-columns: repeat(12, 1fr)
  grid-template-areas: |
    "title title title title title title title title title title title title"
    "status status status status status status status status status status status status"
    "chips chips chips chips chips chips chips chips chips chips chips chips"
    "hangup hangup hangup record record record caller caller caller last last last"
    "dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle dialtitle"
    "dial1 dial1 dial1 dial1 dial2 dial2 dial2 dial2 outbound outbound outbound outbound"
    "smstitle smstitle smstitle smstitle smstitle smstitle smstitle smstitle smstitle smstitle smstitle smstitle"
    "smsform smsform smsform smsform smsform smsform smsform smsform send send send send"
    "historytitle historytitle historytitle historytitle historytitle historytitle historytitle historytitle historytitle historytitle historytitle historytitle"
    "history history history history history history history history history history history history"
  grid-gap: 12px
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: 1fr 1fr
      grid-template-areas: |
        "title title"
        "status status"
        "chips chips"
        "hangup record"
        "caller caller"
        "last last"
        "dialtitle dialtitle"
        "dial1 dial1"
        "dial2 dial2"
        "outbound outbound"
        "smstitle smstitle"
        "smsform smsform"
        "send send"
        "historytitle historytitle"
        "history history"

cards:
  - type: custom:mushroom-title-card
    title: sipgate.io
    subtitle: Calls, recording, SMS and recent history
    view_layout:
      grid-area: title

  - type: custom:mushroom-template-card
    entity: sensor.sipgate_io_call_state
    primary: >-
      {% set s = states('sensor.sipgate_io_call_state') %}
      {% if s == 'ringing' %}
        Call ringing
      {% elif s == 'answered' %}
        Call connected
      {% else %}
        No active call
      {% endif %}
    secondary: >-
      {% set call =
        state_attr('binary_sensor.sipgate_io_call_active', 'current_call')
        or {}
      %}
      {% if call %}
        {% if call.direction == 'in' %}
          From: {{ call.display | default(call.from, true) }}
        {% else %}
          To: {{ call.to | default(call.display, true) }}
        {% endif %}
        · {{ call.call_id }}
        {% if call.recording %} · 🔴 Recording{% endif %}
      {% else %}
        Outbound caller ID: +441513200220
      {% endif %}
    icon: >-
      {% set s = states('sensor.sipgate_io_call_state') %}
      {% if s == 'ringing' %}
        mdi:phone-ring
      {% elif s == 'answered' %}
        mdi:phone-in-talk
      {% else %}
        mdi:phone-outline
      {% endif %}
    icon_color: >-
      {% set s = states('sensor.sipgate_io_call_state') %}
      {% if s == 'ringing' %}amber
      {% elif s == 'answered' %}green
      {% else %}grey
      {% endif %}
    multiline_secondary: true
    fill_container: true
    view_layout:
      grid-area: status

  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: binary_sensor.sipgate_io_call_active
        icon: mdi:phone
        content_info: state
      - type: entity
        entity: sensor.sipgate_io_call_state
        icon: mdi:phone-in-talk
        content_info: state
      - type: entity
        entity: sensor.sipgate_io_recent_calls
        icon: mdi:history
        content_info: state
      - type: template
        icon: mdi:api
        content: >-
          {{ states('sensor.sipgate_io_api_requests_today') }} API today
      - type: template
        icon: mdi:counter
        content: >-
          {{ states('sensor.sipgate_io_api_requests_lifetime') }} lifetime
      - type: template
        icon: mdi:record-rec
        icon_color: >-
          {% set call =
            state_attr('binary_sensor.sipgate_io_call_active', 'current_call')
            or {}
          %}
          {% if call.get('recording') %}red{% else %}grey{% endif %}
        content: >-
          {% set call =
            state_attr('binary_sensor.sipgate_io_call_active', 'current_call')
            or {}
          %}
          {% if call.get('recording') %}Recording{% else %}Not recording{% endif %}
    alignment: center
    view_layout:
      grid-area: chips

  - type: custom:button-card
    entity: binary_sensor.sipgate_io_call_active
    name: Hang up
    icon: mdi:phone-hangup
    tap_action:
      action: call-service
      service: sipgate_ha.hang_up
      service_data:
        call_id: >
          [[[
            return entity.attributes.current_call?.call_id || "";
          ]]]
    state:
      - value: "on"
        styles:
          icon:
            - color: var(--red-color)
      - value: "off"
        styles:
          card:
            - opacity: 0.35
    styles:
      card:
        - height: 115px
        - border-radius: 18px
    view_layout:
      grid-area: hangup

  - type: custom:button-card
    entity: binary_sensor.sipgate_io_call_active
    name: >
      [[[
        return entity.attributes.current_call?.recording
          ? "Stop recording"
          : "Start recording";
      ]]]
    icon: >
      [[[
        return entity.attributes.current_call?.recording
          ? "mdi:stop-circle"
          : "mdi:record-rec";
      ]]]
    tap_action:
      action: call-service
      service: >
        [[[
          return entity.attributes.current_call?.recording
            ? "sipgate_ha.stop_recording"
            : "sipgate_ha.start_recording";
        ]]]
      service_data:
        call_id: >
          [[[
            return entity.attributes.current_call?.call_id || "";
          ]]]
        announcement: >
          [[[
            return !entity.attributes.current_call?.recording;
          ]]]
    state:
      - value: "off"
        styles:
          card:
            - opacity: 0.35
    styles:
      card:
        - height: 115px
        - border-radius: 18px
    view_layout:
      grid-area: record

  - type: custom:mushroom-template-card
    entity: sensor.sipgate_io_last_caller
    primary: Last caller
    secondary: "{{ states('sensor.sipgate_io_last_caller') }}"
    icon: mdi:account-arrow-left
    icon_color: blue
    tap_action:
      action: more-info
    view_layout:
      grid-area: caller

  - type: custom:mushroom-template-card
    entity: sensor.sipgate_io_last_call
    primary: Last call
    secondary: "{{ states('sensor.sipgate_io_last_call') }}"
    icon: mdi:phone-log
    icon_color: purple
    tap_action:
      action: more-info
    view_layout:
      grid-area: last

  - type: custom:mushroom-title-card
    title: Click to call
    subtitle: Replace e14 with your own sipgate extension if needed
    view_layout:
      grid-area: dialtitle

  - type: custom:button-card
    name: Call mobile
    label: "+447700900123"
    show_label: true
    icon: mdi:cellphone
    tap_action:
      action: call-service
      service: sipgate_ha.click_to_call
      service_data:
        from: e14
        to: "+447700900123"
        caller_id: "+441513200220"
    styles:
      card:
        - height: 115px
        - border-radius: 18px
    view_layout:
      grid-area: dial1

  - type: custom:button-card
    name: Call office
    label: "+442071111111"
    show_label: true
    icon: mdi:office-building
    tap_action:
      action: call-service
      service: sipgate_ha.click_to_call
      service_data:
        from: e14
        to: "+442071111111"
        caller_id: "+441513200220"
    styles:
      card:
        - height: 115px
        - border-radius: 18px
    view_layout:
      grid-area: dial2

  - type: custom:mushroom-template-card
    primary: Outbound number
    secondary: "+441513200220"
    icon: mdi:phone-outgoing
    icon_color: green
    view_layout:
      grid-area: outbound

  - type: custom:mushroom-title-card
    title: Send SMS
    subtitle: Sender number is configured in sipgate; API uses the Web SMS extension ID
    view_layout:
      grid-area: smstitle

  - type: entities
    entities:
      - entity: input_text.sipgate_sms_id
        name: Web SMS extension ID
      - entity: input_text.sipgate_sms_recipient
        name: Recipient
      - entity: input_text.sipgate_sms_message
        name: Message
    view_layout:
      grid-area: smsform

  - type: custom:button-card
    name: Send SMS
    icon: mdi:message-arrow-right
    tap_action:
      action: call-service
      service: sipgate_ha.send_sms
      service_data:
        sms_id: >
          [[[
            return states['input_text.sipgate_sms_id']?.state || 's0';
          ]]]
        recipient: >
          [[[
            return states['input_text.sipgate_sms_recipient']?.state || '';
          ]]]
        message: >
          [[[
            return states['input_text.sipgate_sms_message']?.state || '';
          ]]]
    styles:
      card:
        - height: 115px
        - border-radius: 18px
      icon:
        - color: var(--blue-color)
    view_layout:
      grid-area: send

  - type: custom:mushroom-title-card
    title: Recent calls
    subtitle: Latest calls returned by sipgate history
    view_layout:
      grid-area: historytitle

  - type: custom:flex-table-card
    entities:
      - sensor.sipgate_io_recent_calls
    max_rows: 10
    sort_by: when-
    disable_header_sort: false
    selectable: true

    columns:
      - name: When
        id: when
        data: calls.created
        sort_unmodified: true
        modify: >-
          (() => {
            const d = new Date(x);
            if (Number.isNaN(d.getTime())) return x || '—';
            const now = new Date();
            const today = new Date(
              now.getFullYear(), now.getMonth(), now.getDate()
            );
            const day = new Date(
              d.getFullYear(), d.getMonth(), d.getDate()
            );
            const diff = Math.round((today - day) / 86400000);
            const time = d.toLocaleTimeString([], {
              hour: '2-digit',
              minute: '2-digit'
            });
            if (diff === 0) return `Today ${time}`;
            if (diff === 1) return `Yesterday ${time}`;
            if (diff > 1 && diff < 7) {
              return `${d.toLocaleDateString([], {
                weekday: 'short'
              })} ${time}`;
            }
            return `${d.toLocaleDateString([], {
              day: '2-digit',
              month: 'short'
            })} ${time}`;
          })()

      - name: ""
        id: direction
        data: calls
        align: center
        modify: >-
          (() => {
            const direction = String(x.direction || '').toUpperCase();
            const incoming = x.incoming === true
              || direction === 'INCOMING'
              || direction === 'MISSED_INCOMING';
            const status = String(
              x.callStatus || x.status || ''
            ).toUpperCase();
            const missed = status === 'NOPICKUP' && incoming;
            const colour = missed
              ? 'var(--error-color)'
              : incoming
                ? 'var(--info-color, var(--primary-color))'
                : 'var(--primary-color)';
            return `<span style="font-size:20px;color:${colour}">${incoming ? '↙' : '↗'}</span>`;
          })()

      - name: Party
        id: party
        data: calls
        modify: >-
          (() => {
            const direction = String(x.direction || '').toUpperCase();
            const incoming = x.incoming === true
              || direction === 'INCOMING'
              || direction === 'MISSED_INCOMING';
            const status = String(
              x.callStatus || x.status || ''
            ).toUpperCase();
            const missed = status === 'NOPICKUP' && incoming;
            const alias = String(
              incoming ? (x.sourceAlias || '') : (x.targetAlias || '')
            ).trim();
            const number = incoming ? x.source : x.target;
            const localAlias = String(
              incoming ? (x.targetAlias || '') : (x.sourceAlias || '')
            ).trim();
            const localNumber = incoming ? x.target : x.source;
            const local = localAlias || localNumber || 'Unknown';
            const label = alias || number || 'Unknown';
            const detail = alias && number ? number : '';
            const esc = value => String(value || '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const route = `${incoming ? 'Incoming to' : 'Outgoing from'} ${esc(local)}`;
            const colour = missed
              ? 'var(--error-color)'
              : 'var(--primary-text-color)';
            return `<div style="line-height:1.25"><div style="font-weight:600;color:${colour}">${esc(label)}</div>${detail ? `<div style="font-size:12px;color:var(--secondary-text-color)">${esc(detail)}</div>` : ''}<div style="font-size:11px;color:var(--secondary-text-color);opacity:.8">${route}</div></div>`;
          })()

      - name: Result
        id: result
        data: calls
        modify: >-
          (() => {
            const status = String(
              x.callStatus || x.status || ''
            ).toUpperCase();
            if (status === 'PICKUP') {
              return '<span style="color:var(--success-color, var(--green-color));font-weight:600">Answered</span>';
            }
            if (status === 'NOPICKUP') {
              const direction = String(x.direction || '').toUpperCase();
              const incoming = x.incoming === true
                || direction === 'INCOMING'
                || direction === 'MISSED_INCOMING';
              if (incoming) {
                return '<span style="color:var(--error-color);font-weight:600">Missed</span>';
              }
              return '<span style="color:var(--warning-color, var(--amber-color));font-weight:600">No answer</span>';
            }
            const safe = status
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            return safe || '—';
          })()

      - name: Duration
        id: duration
        data: calls.duration
        sort_unmodified: true
        align: right
        modify: >-
          (() => {
            const total = Math.max(0, Math.floor(Number(x) || 0));
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const seconds = total % 60;
            if (hours > 0) {
              return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
          })()

      - name: Rec
        id: recording
        data: calls
        align: center
        modify: >-
          (() => {
            const recordings = Array.isArray(x.recordings)
              ? x.recordings
              : [];
            const recording = recordings.find(
              item => item && (
                item.url ||
                item.recordingUrl ||
                item.downloadUrl
              )
            );
            if (!recording) return '';
            const url = String(
              recording.url ||
              recording.recordingUrl ||
              recording.downloadUrl
            );
            if (!/^https?:\\/\\//i.test(url)) return '●';
            const safe = url
              .replaceAll('&', '&amp;')
              .replaceAll('"', '&quot;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            return `<a href="${safe}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;font-size:18px" title="Open recording">▶</a>`;
          })()

    css:
      table+: |
        width: 100%;
        border-collapse: collapse;

      thead th+: |
        padding: 10px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--secondary-text-color);
        border-bottom: 1px solid var(--divider-color);

      tbody td+: |
        padding: 11px 10px;
        vertical-align: middle;
        border-bottom: 1px solid var(--divider-color);

      tbody tr+: |
        transition: background 120ms ease;

      tbody tr:hover+: |
        background: var(--secondary-background-color);

      tbody tr:last-child td+: |
        border-bottom: 0;

    view_layout:
      grid-area: history
